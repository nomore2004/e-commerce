services:
  db:
    image: postgres:16-alpine
    container_name: procurex_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-procurex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procurex_password}
      POSTGRES_DB: ${POSTGRES_DB:-procurex_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-procurex_user} -d ${POSTGRES_DB:-procurex_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
